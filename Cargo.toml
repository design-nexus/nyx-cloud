[package]
name = "nyx-cloud"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-cloud"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }

nyx-accounts-native = { package = "nyx-accounts-service", git = "https://github.com/design-nexus/nyx-accounts.git", rev = "ecbe31cbfe6688dd5b3d7803c58e433715427c57" }
libc = "0.2"
chrono = "0.4"
url = "2"

[[bin]]
name = "nyx-cloudd"
path = "src/main.rs"
